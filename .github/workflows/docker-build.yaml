name: docker-build

on:
  pull_request:
    paths:
      - 'infra/docker/**'
      - '.github/workflows/docker-build.yaml'
  push:
    branches: [main]
    paths:
      - 'infra/docker/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: build full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/profile/full/Dockerfile
          push: false
          tags: research-dev:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
