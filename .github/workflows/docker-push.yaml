name: docker-push

on:
  push:
    branches: [main]
    paths:
      - 'infra/docker/**'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/profile/full/Dockerfile
          push: true
          tags: |
            ghcr.io/yifen9/research-dev:latest
            ghcr.io/yifen9/research-dev:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
