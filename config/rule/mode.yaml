mode:
  required:
    - review
    - scout
    - governance
    - repair
    - full-research
    - autopilot

  key:
    - purpose
    - allowed_path
    - denied_path
    - require_confirm
    - require_check
    - stop_condition
    - output

  data:
    review:
      purpose: inspect without changing artifacts
      allowed_path: []
      denied_path: [agent, config, src, script, project, doc, out]
      require_confirm: false
      require_check: []
      stop_condition: [write_needed]
      output: review

    scout:
      purpose: explore and propose future work
      allowed_path: []
      denied_path: [agent, config, src, script, project, doc, out]
      require_confirm: false
      require_check: []
      stop_condition: [write_needed, governance_change]
      output: choice

    governance:
      purpose: maintain rule workflow backend and config source
      allowed_path: [agent, config, script, src, test]
      denied_path: [out]
      require_confirm: true
      require_check: [rule, test, compile, backend, session]
      stop_condition: [approval_missing, commit_missing]
      output: decision

    repair:
      purpose: fix failing checks within a scoped boundary
      allowed_path: [src, script, test, doc]
      denied_path: [agent, config/rule, config/agent.yaml]
      require_confirm: false
      require_check: [target, rule, test]
      stop_condition: [scope_unclear, repeated_failure, governance_change]
      output: summary

    full-research:
      purpose: move from idea to proposal experiment report and release
      allowed_path: [project, doc, src, script, test]
      denied_path: [agent, config/rule, config/agent.yaml]
      require_confirm: true
      require_check: [project, rule, test, report]
      stop_condition: [stage_gate, governance_change, release_boundary]
      output: report

    autopilot:
      purpose: continue low risk scoped work until a stop condition appears
      allowed_path: [project, doc, test]
      denied_path: [agent, config, src, script]
      require_confirm: true
      require_check: [rule, test, session]
      stop_condition: [human_needed, p0_path, repeated_failure, budget_limit, time_limit]
      output: handoff
